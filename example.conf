# signed-relay-lite configuration
#
# All settings are required. Lines starting with '#' are comments.
# Format: key=value (no quoting, no shell expansion).

# DKIM signing domain (d= tag in the DKIM-Signature header).
# Lowercase DNS name, no trailing dot.
domain=example.com

# DKIM key selector (s= tag). Must exist as a TXT record at
# <selector>._domainkey.<domain>.
selector=mail2026

# Path to an unencrypted PEM RSA private key (2048–4096 bits).
# The daemon reads this at startup; it is not re-read on reload.
# Recommended: chmod 400, owned by the daemon user.
private_key=/etc/signed-relay-lite/mail.pem

# Unix domain socket for message submission.
# Format: unix:<absolute-path>. The socket is created with mode 0o660.
listen=unix:/run/signed-relay-lite/submit.sock

# Smarthost hostname. All accepted messages are relayed here.
relay_host=smtp.example.net

# Smarthost port. Typically 465 for implicit TLS (RFC 8314).
relay_port=465

# TLS mode. Only "implicit" is supported — TLS from the first byte
# of the TCP connection. Certificate verification cannot be disabled.
relay_tls=implicit

# SMTP AUTH credentials. Both must be set (for AUTH) or both empty
# (for no AUTH). The password file contains the raw password bytes.
# Recommended: chmod 400, owned by the daemon user.
relay_username=
relay_password_file=

# EHLO/HELO hostname presented to the smarthost.
client_name=mailer.example.com

# Number of dedicated SMTP delivery worker threads.
# Must not exceed max_concurrent_submissions.
relay_workers=4

# Maximum size of a single submitted message, in bytes.
# The sendmail client enforces this limit on stdin reads.
# (26214400 = 25 MiB)
max_message_bytes=26214400

# Total memory cap for all in-flight messages combined, in bytes.
# New submissions block when this budget is exhausted.
# Must be >= max_message_bytes. (134217728 = 128 MiB)
global_message_memory_bytes=134217728

# Maximum number of simultaneous submission handlers.
# Each handler holds one message in memory until delivery completes.
max_concurrent_submissions=16

# Timeout for a single submission connection (seconds).
# Covers reading the message body and writing the response.
submission_timeout_seconds=60

# Timeout for the upstream SMTP delivery attempt (seconds).
# Covers the TLS handshake, EHLO, MAIL/RCPT/DATA, and the final dot.
delivery_timeout_seconds=120

# Require FIPS mode at startup (true/false).
# When true, the daemon checks that the kernel and OpenSSL both
# report FIPS mode as active. Refuses to start if either disagrees.
# On non-Linux platforms this setting is accepted but not enforced.
require_fips=true
